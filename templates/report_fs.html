<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보고용 재무제표 — 연결 재무보고 시스템</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root {
  --brand-900:#1F3864; --brand-700:#2F5597; --brand-500:#4472C4; --brand-050:#EBF0FA;
  --surface:#f0f4f8; --card-bg:#fff; --text-body:#1a202c; --text-muted:#6c757d;
  --border:#dee2e6; --rule:#333;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand-900:#4472C4; --brand-700:#5A8DD6; --brand-500:#6FA1E0; --brand-050:#1a2942;
    --surface:#0f172a; --card-bg:#1e293b; --text-body:#e2e8f0; --text-muted:#94a3b8;
    --border:#334155; --rule:#94a3b8;
  }
  body { color-scheme: dark; }
  .card { background:var(--card-bg); color:var(--text-body); }
  .form-select { background:#0f172a; color:var(--text-body); border-color:var(--border); }
}
body { background:var(--surface); color:var(--text-body);
       font-family:'Pretendard Variable', Pretendard, system-ui, 'Malgun Gothic', sans-serif; }
.navbar { background:var(--brand-900) !important; }
.section-card { border:1px solid var(--border); border-radius:10px; }

/* ── 공시 양식 표 ─────────────────────────────── */
.fs-wrap { background:var(--card-bg); border-radius:8px; padding:22px 26px 26px; overflow-x:auto; }
.fs-title { text-align:center; font-size:1.35rem; font-weight:800; letter-spacing:.35em; margin:0 0 14px; }
.fs-sub { font-size:.86rem; margin:0; }
.fs-entity { display:flex; justify-content:space-between; align-items:flex-end;
             margin:14px 0 6px; font-size:.9rem; font-weight:600; }
.fs-unit { font-size:.82rem; color:var(--text-muted); font-weight:500; }
.fs-table { width:100%; border-collapse:collapse; font-size:.87rem; }
.fs-table th { border-top:2px solid var(--rule); border-bottom:1px solid var(--rule);
               padding:7px 10px; font-weight:700; text-align:center; white-space:nowrap; }
.fs-table th:first-child { text-align:center; }
.fs-table td { padding:3px 10px; }
.fs-table td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:150px; }
.fs-table tr.lv0 > td { font-weight:700; }
.fs-table tr.lv1 > td:first-child { padding-left:22px; font-weight:600; }
.fs-table tr.lv2 > td:first-child { padding-left:40px; }
.fs-table tr.sub > td { background:var(--brand-050); }
.fs-table tr.total > td { border-top:1px solid var(--rule); border-bottom:2px double var(--rule); font-weight:800; }
.fs-table td.cell-sel { outline:2px solid var(--brand-700); outline-offset:-2px; }
/* 편집 모드 */
.fs-table td.base { color:var(--text-muted); }
.fs-table td.manual { padding:1px 6px; }
.man-input { width:100%; max-width:140px; text-align:right; font-size:.82rem;
             padding:2px 6px; border:1px solid var(--border); border-radius:4px;
             background:#FFFBEA; color:#1a202c; }
@media (prefers-color-scheme: dark) { .man-input { background:#3a3320; color:#f0e6c8; } }
.fs-table tr.added > td:first-child { color:var(--brand-700); }
.added-tag { font-size:.68rem; font-weight:700; padding:1px 6px; border-radius:999px;
             background:var(--brand-050); color:var(--brand-900); margin-left:6px; }
.btn-del { border:none; background:none; color:#b4232e; font-weight:700; cursor:pointer;
           padding:0 4px; line-height:1; }
.pill { font-size:.78rem; padding:3px 10px; border-radius:999px; background:var(--brand-050);
        color:var(--brand-900); font-weight:700; }
.tabs .btn { min-width:120px; }
</style>
</head>
<body>

{% set active_menu = 'report_fs' %}
{% include '_sidebar.html' %}
{% include '_topbar.html' %}

<div class="container-fluid mt-3">

  <div class="card section-card mb-3">
    <div class="card-body d-flex align-items-center gap-3 flex-wrap">
      <label class="fw-bold mb-0"><i class="bi bi-diagram-3"></i> 연결그룹</label>
      <select id="groupSelect" class="form-select" style="max-width:220px" onchange="load()"></select>

      <label class="fw-bold mb-0"><i class="bi bi-calendar3"></i> 결산기간</label>
      <select id="periodSelect" class="form-select" style="max-width:160px" onchange="load()">
        {% for y in years %}
        <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>

      <div class="btn-group tabs" role="group">
        <button class="btn btn-outline-primary active" data-stmt="BS" onclick="setStmt('BS')">재무상태표</button>
        <button class="btn btn-outline-primary" data-stmt="PL" onclick="setStmt('PL')">손익계산서</button>
        <button class="btn btn-outline-primary" data-stmt="CF" onclick="setStmt('CF')">현금흐름표</button>
      </div>

      <div class="form-check mb-0 ms-2">
        <input class="form-check-input" type="checkbox" id="hideZero" checked onchange="load()">
        <label class="form-check-label small" for="hideZero">
          값 0 라인 숨기기 <span class="text-muted" id="hiddenCnt"></span>
        </label>
      </div>

      <div class="ms-auto d-flex gap-2 align-items-center">
        <div id="editBox" class="d-none d-flex gap-2 align-items-center">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="editToggle" onchange="setEdit(this.checked)">
            <label class="form-check-label small fw-bold" for="editToggle">편집</label>
          </div>
          <button id="addBtn" class="btn btn-outline-primary btn-sm d-none" onclick="openAdd()">
            <i class="bi bi-plus-circle"></i> 계정 추가
          </button>
          <button id="saveBtn" class="btn btn-warning btn-sm d-none" onclick="saveManuals()">
            <i class="bi bi-floppy"></i> 수기조정 저장
          </button>
        </div>
        <button class="btn btn-primary btn-sm" onclick="copyTable(this)">
          <i class="bi bi-clipboard"></i> 전체 복사
        </button>
        <a id="xlsBtn" class="btn btn-success btn-sm" href="#">
          <i class="bi bi-download"></i> 엑셀 다운로드
        </a>
      </div>
    </div>
  </div>

  <div id="notice"></div>

  <!-- 계정 추가 모달 -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header" style="background:var(--brand-900); color:#fff;">
          <h5 class="modal-title">보고 계정 추가</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">
            기타 계정에 묶여 있던 항목을 별도 줄로 뽑을 때 사용합니다.
            선택한 계정은 원래 있던 줄에서 자동으로 빠지므로 이중계상되지 않습니다.
          </p>
          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold mb-1">계정명</label>
              <input type="text" id="newName" class="form-control form-control-sm" placeholder="예: 국고보조금">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold mb-1">삽입 위치 (이 줄 바로 아래)</label>
              <select id="newAfter" class="form-select form-select-sm"></select>
            </div>
          </div>
          <label class="form-label small fw-bold mb-1">가져올 계정 선택</label>
          <input type="text" id="acctSearch" class="form-control form-control-sm mb-2"
                 placeholder="계정명 또는 코드로 검색" oninput="renderAccts()">
          <div style="max-height:44vh; overflow:auto; border:1px solid var(--border); border-radius:6px;">
            <table class="table table-sm table-hover mb-0" id="acctTable">
              <thead style="position:sticky; top:0; background:var(--brand-900); color:#fff;">
                <tr><th style="width:36px"></th><th>코드</th><th>계정명</th>
                    <th class="text-end">당기금액</th><th>현재 위치</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <span id="addMsg" class="me-auto small"></span>
          <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
          <button class="btn btn-primary" onclick="submitAdd()">추가</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card section-card">
    <div class="card-body">
      <div class="fs-wrap" id="area">
        <div class="text-center py-5 text-muted"><span class="spinner-border"></span> 불러오는 중…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let STMT = 'BS';
let GROUPS = [];
let EDIT = false;      // 편집 모드
let DATA = null;       // 마지막 응답
let ACCTS = [];        // 계정 추가 모달용 목록

function setEdit(on){
  EDIT = !!on;
  document.getElementById('addBtn').classList.toggle('d-none', !EDIT);
  document.getElementById('saveBtn').classList.toggle('d-none', !EDIT);
  if (DATA) render(DATA);
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function period(){return document.getElementById('periodSelect').value;}
function groupId(){return document.getElementById('groupSelect').value;}

// 원 단위 · 음수는 괄호
function fmt(v){
  const n = Math.round(Number(v)||0);
  if (n === 0) return '-';
  return n < 0 ? '(' + Math.abs(n).toLocaleString('ko-KR') + ')' : n.toLocaleString('ko-KR');
}

function setStmt(s){
  STMT = s;
  document.querySelectorAll('.tabs .btn').forEach(b =>
    b.classList.toggle('active', b.dataset.stmt === s));
  load();
}

async function loadGroups(){
  const r = await fetch('/consolidation/groups?year=' + encodeURIComponent(period()));
  const j = await r.json();
  GROUPS = j.groups || [];
  const sel = document.getElementById('groupSelect');
  sel.innerHTML = GROUPS.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
}

async function load(){
  const area = document.getElementById('area');
  const notice = document.getElementById('notice');
  if (!groupId()){ area.innerHTML = '<div class="text-muted py-4">연결그룹이 없습니다.</div>'; return; }
  const url = `/report-fs/data?group_id=${encodeURIComponent(groupId())}&year=${encodeURIComponent(period())}&stmt=${STMT}`;
  document.getElementById('xlsBtn').href =
      `/report-fs/excel?group_id=${encodeURIComponent(groupId())}&year=${encodeURIComponent(period())}`
      + `&stmt=${STMT}&hide_zero=${hideZeroOn() ? 1 : 0}`;
  area.innerHTML = '<div class="text-center py-5 text-muted"><span class="spinner-border"></span> 계산 중…</div>';
  notice.innerHTML = '';
  try{
    const res = await fetch(url);
    const d = await res.json();
    if (!res.ok || d.error) throw new Error(d.error || '조회 실패');
    render(d);
  }catch(e){
    area.innerHTML = `<div class="alert alert-danger mb-0">${esc(e.message)}</div>`;
  }
}

function hideZeroOn(){ return document.getElementById('hideZero').checked; }

function render(d){
  DATA = d;
  document.getElementById('editBox').classList.toggle('d-none', !d.can_edit);
  const all = d.rows || [];
  // 값 0 라인 숨기기 — 상세 라인만 대상. 소계·총계·표제는 항상 표시하고,
  // 편집 모드에서는 수기조정을 넣을 수 있도록 모두 보여준다.
  let hidden = 0;
  const rows = (hideZeroOn() && !EDIT)
    ? all.filter(r => {
        if (r.kind !== 'detail') return true;
        if (Math.round(r.cur || 0) !== 0 || Math.round(r.pri || 0) !== 0) return true;
        hidden++; return false;
      })
    : all;
  document.getElementById('hiddenCnt').textContent = hidden ? `(${hidden}개 숨김)` : '';
  const body = rows.map(r => {
    const cls = ['lv' + r.level, (r.kind === 'subtotal' || r.kind === 'header') ? 'sub' : ''];
    if (/(총계|합계|당기순이익|기말의현금)/.test(r.name) && r.kind === 'subtotal') cls.push('total');
    if (r.added_id) cls.push('added');
    const nameCell = r.added_id
      ? `${esc(r.name)} <span class="added-tag">추가</span>
         <button class="btn-del" title="추가한 계정 삭제" onclick="delLine('${r.added_id}')">×</button>`
      : esc(r.name);
    const isHdr = r.kind === 'header';
    const editCells = EDIT ? `
      <td class="num base">${isHdr ? '' : fmt(r.base)}</td>
      <td class="num manual">${r.kind === 'detail'
        ? `<input type="number" class="man-input" data-row="${r.row}" value="${r.manual || ''}"
                  placeholder="0" title="${esc(r.memo||'')}">`
        : ''}</td>` : '';
    return `<tr class="${cls.join(' ')}">
      <td>${nameCell}</td>
      ${editCells}
      <td class="num" data-val="${isHdr ? '' : Math.round(r.cur||0)}">${isHdr ? '' : fmt(r.cur)}</td>
      <td class="num" data-val="${isHdr ? '' : Math.round(r.pri||0)}">${isHdr ? '' : fmt(r.pri)}</td>
    </tr>`;
  }).join('');

  const editHead = EDIT ? '<th>산출값</th><th>수기조정</th>' : '';
  document.getElementById('area').innerHTML = `
    <div class="fs-title">${esc(d.title)}</div>
    <div class="fs-sub">당기 : ${esc(d.cur_label)}</div>
    <div class="fs-sub">전기 : ${esc(d.pri_label)}</div>
    <div class="fs-entity"><span>${esc(d.entity)}</span><span class="fs-unit">(단위 : 원)</span></div>
    <table class="fs-table" id="fsTable">
      <thead><tr><th style="width:${EDIT ? 34 : 46}%">과&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;목</th>
        ${editHead}<th>당기</th><th>전기</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;

  // ── 검산 표시 ────────────────────────────────────────────
  const V = n => { const r = all.find(x => x.name === n); return r ? r.cur : 0; };
  const notes = [];
  if (d.stmt === 'BS'){
    const diff = Math.round(V('자산총계') - V('부채총계') - V('자본총계'));
    notes.push(diff === 0
      ? {ok:true,  t:'대차 일치 (자산 = 부채 + 자본)'}
      : {ok:false, t:`대차 불일치 : 자산 − (부채+자본) = ${fmt(diff)}`});
  } else if (d.stmt === 'CF'){
    const lhs = V('Ⅳ. 현금의 증가(감소) (Ⅰ+Ⅱ+Ⅲ)') + V('Ⅴ. 환율변동효과')
              + V('연결범위변동') + V('Ⅵ. 기초의현금');
    const diff = Math.round(lhs - V('Ⅶ. 기말의현금'));
    notes.push(diff === 0
      ? {ok:true,  t:'현금흐름 항등식 일치 (Ⅳ+Ⅴ+연결범위변동+Ⅵ = Ⅶ)'}
      : {ok:false, t:`현금흐름 항등식 불일치 : 차이 ${fmt(diff)}`});
  }
  if (Math.round(d.manual_total || 0) !== 0){
    notes.push({ok:null, t:`수기조정 반영액 ${fmt(d.manual_total)} — 조정 전 금액은 편집 모드의 [산출값] 열에서 확인하세요.`});
  }
  if (!d.prior_period){
    notes.push({ok:false, t:'전기(전년 4분기) 자료를 불러오지 못해 전기 열이 0으로 표시됩니다.'});
  }
  document.getElementById('notice').innerHTML = notes.map(n => {
    const cls = n.ok === true ? 'alert-success' : n.ok === false ? 'alert-danger' : 'alert-warning';
    const ico = n.ok === true ? 'check-circle-fill' : n.ok === false ? 'exclamation-triangle-fill' : 'pencil-fill';
    return `<div class="alert ${cls} py-2 px-3 small mb-2">
              <i class="bi bi-${ico} me-1"></i>${esc(n.t)}</div>`;
  }).join('');
}

// ── 수기조정 저장 ────────────────────────────────────────────
async function saveManuals(){
  const edits = {};
  document.querySelectorAll('.man-input').forEach(i => {
    const v = i.value.trim();
    edits[i.dataset.row] = { amount: v === '' ? 0 : Number(v), memo: '' };
  });
  try{
    const r = await fetch('/report-fs/manual', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({group_id: groupId(), year: period(), stmt: STMT, edits})
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || '저장 실패');
    load();
  }catch(e){ alert('저장 실패: ' + e.message); }
}

// ── 계정 추가 ────────────────────────────────────────────────
async function openAdd(){
  const sel = document.getElementById('newAfter');
  sel.innerHTML = (DATA.rows || []).map(r =>
    `<option value="${r.row}">${'　'.repeat(r.level)}${esc(r.name)}</option>`).join('');
  document.getElementById('newName').value = '';
  document.getElementById('acctSearch').value = '';
  document.getElementById('addMsg').textContent = '계정 목록 불러오는 중…';
  new bootstrap.Modal(document.getElementById('addModal')).show();
  try{
    const r = await fetch(`/report-fs/accounts?group_id=${encodeURIComponent(groupId())}&year=${encodeURIComponent(period())}&stmt=${STMT}`);
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || '조회 실패');
    ACCTS = j.accounts || [];
    document.getElementById('addMsg').textContent = '';
    renderAccts();
  }catch(e){ document.getElementById('addMsg').innerHTML = `<span class="text-danger">${esc(e.message)}</span>`; }
}

function renderAccts(){
  const q = (document.getElementById('acctSearch').value || '').trim().toLowerCase();
  const list = ACCTS.filter(a => !q || a.code.toLowerCase().includes(q) || (a.name||'').toLowerCase().includes(q));
  document.querySelector('#acctTable tbody').innerHTML = list.slice(0, 400).map(a => `
    <tr>
      <td><input type="checkbox" class="acct-chk" value="${a.code}"></td>
      <td class="small">${esc(a.code)}</td>
      <td class="small">${esc(a.name)}</td>
      <td class="small text-end">${fmt(a.amount)}</td>
      <td class="small text-muted">${esc(a.where || '—')}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="text-muted small p-3">검색 결과 없음</td></tr>';
}

async function submitAdd(){
  const name = document.getElementById('newName').value.trim();
  const after = document.getElementById('newAfter').value;
  const codes = Array.from(document.querySelectorAll('.acct-chk:checked')).map(c => c.value);
  const msg = document.getElementById('addMsg');
  if (!name){ msg.innerHTML = '<span class="text-danger">계정명을 입력하세요.</span>'; return; }
  if (!codes.length){ msg.innerHTML = '<span class="text-danger">가져올 계정을 1개 이상 선택하세요.</span>'; return; }
  try{
    const r = await fetch('/report-fs/line', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({stmt: STMT, after_row: after, name, level: 2, codes})
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || '추가 실패');
    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
    load();
  }catch(e){ msg.innerHTML = `<span class="text-danger">${esc(e.message)}</span>`; }
}

async function delLine(id){
  if (!confirm('추가한 보고 계정을 삭제할까요?\n해당 계정들은 원래 있던 줄로 돌아갑니다.')) return;
  try{
    const r = await fetch('/report-fs/line', {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({stmt: STMT, id})
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || '삭제 실패');
    load();
  }catch(e){ alert('삭제 실패: ' + e.message); }
}

// ── 셀 선택 · 방향키 · 서식없는 복사 (연결정산표와 동일) ─────────
(function(){
  let sel = null;
  function pick(cell){
    if (!cell) return;
    if (sel) sel.classList.remove('cell-sel');
    sel = cell; cell.classList.add('cell-sel');
    const s = window.getSelection(), r = document.createRange();
    r.selectNodeContents(cell); s.removeAllRanges(); s.addRange(r);
  }
  document.addEventListener('click', e => {
    const t = document.getElementById('fsTable');
    if (!t) return;
    const s = window.getSelection();
    if (s && !s.isCollapsed) return;
    const cell = e.target.closest('td, th');
    if (cell && t.contains(cell)) pick(cell);
  });
  document.addEventListener('keydown', e => {
    if (!sel || !document.body.contains(sel)) return;
    const K = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
    if (!K.includes(e.key)) return;
    const ae = document.activeElement;
    if (ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)) return;
    const tr = sel.parentElement, idx = Array.from(tr.children).indexOf(sel);
    const t = document.getElementById('fsTable');
    let tgt = null;
    if (e.key === 'ArrowLeft') tgt = sel.previousElementSibling;
    if (e.key === 'ArrowRight') tgt = sel.nextElementSibling;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      const rs = Array.from(t.querySelectorAll('tr'));
      const nr = rs[rs.indexOf(tr) + (e.key === 'ArrowUp' ? -1 : 1)];
      if (nr) tgt = nr.children[Math.min(idx, nr.children.length - 1)];
    }
    if (!tgt) return;
    e.preventDefault(); pick(tgt); tgt.scrollIntoView({block:'nearest'});
  });
  document.addEventListener('copy', e => {
    const t = document.getElementById('fsTable');
    const s = window.getSelection();
    if (!t || !s || s.rangeCount === 0 || s.isCollapsed) return;
    if (!t.contains(s.anchorNode)) return;
    const lines = [];
    t.querySelectorAll('tr').forEach(tr => {
      const v = []; let hit = false;
      Array.from(tr.children).forEach(c => {
        if (s.containsNode(c, true)){
          hit = true;
          v.push(c.hasAttribute('data-val') ? c.getAttribute('data-val') : c.innerText.trim());
        }
      });
      if (hit){ lines.push(v.join('\t')); }
    });
    if (!lines.length) return;
    e.preventDefault();
    e.clipboardData.setData('text/plain', lines.join('\n'));
  });
})();

function copyTable(btn){
  const t = document.getElementById('fsTable');
  if (!t) return;
  const lines = [];
  t.querySelectorAll('tr').forEach(tr => {
    const v = [];
    Array.from(tr.children).forEach(c =>
      v.push(c.hasAttribute('data-val') ? c.getAttribute('data-val') : c.innerText.trim()));
    lines.push(v.join('\t'));
  });
  const text = lines.join('\n');
  const orig = btn.innerHTML;
  const done = () => {
    btn.innerHTML = '<i class="bi bi-check-lg"></i> 복사됨!';
    btn.classList.replace('btn-primary','btn-success');
    setTimeout(()=>{ btn.innerHTML = orig; btn.classList.replace('btn-success','btn-primary'); }, 2000);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, ()=>fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}

document.getElementById('periodSelect').addEventListener('change', async () => {
  await loadGroups(); load();
});
(async () => { await loadGroups(); load(); })();
</script>
